<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports – Recognise Me</title>
  <link rel="stylesheet" href="../../Css/Instructor.css" />
</head>
<body data-page="reports">
<header>
  <div class="logo"><p>RM</p></div>
  <div class="brand-name"><p>Recognise me</p><p>Instructor Portal</p></div>
  <nav class="top-nav">
    <a href="Instructor-Dashboard.html">Dashboard</a>
    <a href="enrollments.html">Courses</a>
    <a href="session.html">Session</a>
    <a href="attendance.html">Attendance</a>
    <a href="report.html">Reports</a>
  </nav>
  <button class="btn btn-outline" data-action="logout">Log out</button>
</header>

  <div class="right-content">
    <h2>Report Filters</h2>
    <p class="subtext">Choose a course and date range then click Generate.</p>
    <div class="form-row">
      <div class="input-box"><label for="repCourse">Course</label><select id="repCourse"><option value="">All Courses</option></select></div>
      <div class="input-box"><label for="repStudent">Student ID (optional)</label><input type="text" id="repStudent" placeholder="e.g. 20210001" /></div>
    </div>
    <div class="form-row">
      <div class="input-box"><label for="repFrom">From Date</label><input type="date" id="repFrom" /></div>
      <div class="input-box"><label for="repTo">To Date</label><input type="date" id="repTo" /></div>
    </div>
    <button class="btn btn-primary" id="generateReportBtn">Generate Report</button>
    <div id="reportOutput" style="display:none;">
      <p class="section-title">Report Summary</p>
      <div class="stats-row">
        <div class="stat-box"><p class="s-label">Total Sessions</p><p class="s-value">0</p></div>
        <div class="stat-box"><p class="s-label">Avg Attendance</p><p class="s-value">0%</p></div>
        <div class="stat-box"><p class="s-label">Students Below 75%</p><p class="s-value">0</p></div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <p class="section-title" style="margin:0;">Attendance Summary</p>
        <button class="btn btn-outline" onclick="window.print()">Print / Export</button>
      </div>
      <table>
        <thead><tr><th>Student ID</th><th>Full Name</th><th>Course</th><th>Attended</th><th>Total</th><th>Rate</th><th>Status</th></tr></thead>
        <tbody id="reportTableBody"></tbody>
      </table>
    </div>
  </div>

<script type="module" src="../../Javascript/instructor-portal.js"></script>
</body>
</html>
