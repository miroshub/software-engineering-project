<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Self Registration</title>
    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <header>
      <div class="logo"><p>RM</p></div>
      <div class="brand-name"><p id="text1">Recognise me</p><p id="text2">Self-service portal</p></div>
    </header>
    <div class="page-wrapper">
      <div class="main-layout">
        
        </section>
        <section class="form">
          <div class="container">
            <h2>Create Student Profile</h2>
            <p class="form-subtext">Fill in your details, choose your courses, and complete face registration.</p>
            <form id="registrationForm">
              <div class="form-row">
                <div class="input-box"><label for="fullName">Full Name</label><input type="text" id="fullName" placeholder="Enter full name" required /></div>
                <div class="input-box"><label for="studentId">Student ID</label><input type="text" id="studentId" placeholder="Enter student ID" required /></div>
              </div>
              <div class="form-row">
                <div class="input-box"><label for="email">University Email</label><input type="email" id="email" placeholder="Enter university email" required /></div>
                <div class="input-box"><label for="phone">Phone Number</label><input type="text" id="phone" placeholder="Enter phone number" required /></div>
              </div>
              <div class="form-row">
                <div class="input-box"><label for="department">Department</label><select id="department" required><option value="">Select department</option><option>Computer Science</option><option>Information Systems</option><option>Software Engineering</option><option>Business Informatics</option></select></div>
                <div class="input-box"><label for="academicYear">Academic Year</label><select id="academicYear" required><option value="">Select year</option><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option></select></div>
              </div>
             
              <div class="face-section">
                <h3>Face Registration</h3>
                <p>Capture your face data for future attendance verification.</p>
                <button type="button" id="captureFaceBtn" class="face-btn">Register Face</button>
                <p id="faceStatus" class="face-status">Face data not registered yet.</p>
              </div>
              <div id="statusMessage" class="status-message"></div>
              <div class="button-row"><button type="reset" class="clear-btn">Clear</button><button type="submit" class="submit-btn">Submit Registration</button></div>
            </form>
            <div class="result-box">
              <p id="resultText">Your submitted information will appear here.</p>
              <div id="resultContent"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="form.js"></script>
  </body>
</html>
